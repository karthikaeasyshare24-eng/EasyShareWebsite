<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep emerald green background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023020" />
      <stop offset="50%" stop-color="#012317" />
      <stop offset="100%" stop-color="#00140d" />
    </linearGradient>

    <!-- Center ambient lighting glow -->
    <radialGradient id="centerGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#044d32" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Ring gradient: Bright cyan to vivid lime/mint green -->
    <linearGradient id="ringGrad" x1="12%" y1="88%" x2="88%" y2="12%">
      <stop offset="0%" stop-color="#00f2cb" />
      <stop offset="25%" stop-color="#0be5af" />
      <stop offset="55%" stop-color="#26e38f" />
      <stop offset="85%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#5eed8e" />
    </linearGradient>

    <!-- Mint/Emerald text gradient for Ai -->
    <linearGradient id="aiMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
  </defs>

  <!-- 1. Deep Emerald Green Canvas Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" />
  <rect width="1024" height="1024" fill="url(#centerGlow)" />

  <!-- 2. Emblem: Orbital Swoosh Ring & Sparkle Star -->
  <g transform="translate(512, 330) scale(1.35)">
    <!-- Back orbital glow line -->
    <ellipse cx="0" cy="0" rx="145" ry="58" transform="rotate(-30)" fill="none" stroke="url(#ringGrad)" stroke-width="10" opacity="0.45" />

    <!-- Main 3D crescent swoosh ring -->
    <path d="M -135 48 
             C -90 100 20 102 110 50 
             C 145 28 162 0 162 -14
             C 148 6 122 36 68 56
             C 0 80 -88 72 -135 48 Z" 
          fill="url(#ringGrad)" />

    <!-- 4-pointed sparkling star at top right -->
    <g transform="translate(108, -62)">
      <path d="M 0 -38 
               C 2 -12 10 -2 38 0 
               C 10 2 2 12 0 38 
               C -2 12 -10 2 -38 0 
               C -10 -2 -2 -12 0 -38 Z" 
            fill="#4ade80" />
      <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- 3. Typography: "Mumbai Ai" -->
  <g text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="512" y="670" font-weight="900" font-size="124" letter-spacing="-2">
      <tspan fill="#FFFFFF">Mumbai </tspan>
      <tspan fill="url(#aiMintGrad)">Ai</tspan>
    </text>

    <!-- Typography: "academy" -->
    <text x="512" y="805" font-weight="900" font-size="120" letter-spacing="-2" fill="#FFFFFF">
      academy
    </text>

    <!-- Tagline: "Learn  •  Build  •  Grow" -->
    <text x="512" y="890" font-weight="700" font-size="38" letter-spacing="8" fill="#D1FAE5">
      <tspan>Learn</tspan>
      <tspan fill="#34D399" font-size="34">  •  </tspan>
      <tspan>Build</tspan>
      <tspan fill="#34D399" font-size="34">  •  </tspan>
      <tspan>Grow</tspan>
    </text>
  </g>
</svg>
