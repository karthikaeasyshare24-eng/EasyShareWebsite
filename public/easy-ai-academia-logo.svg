<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Squircle base background gradient: Deep dark emerald -->
    <linearGradient id="sqBaseGrad" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#044d32" />
      <stop offset="35%" stop-color="#023020" />
      <stop offset="75%" stop-color="#011f15" />
      <stop offset="100%" stop-color="#00140d" />
    </linearGradient>

    <!-- Top-Right Rich Emerald Glow inside Squircle (matches studio lighting in pic) -->
    <radialGradient id="topRightGlow" cx="72%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#1dbd77" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#0e8351" stop-opacity="0.65" />
      <stop offset="65%" stop-color="#03442a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#011f15" stop-opacity="0" />
    </radialGradient>

    <!-- Ring gradient: Bright cyan at bottom-left sweeping into vivid lime/mint green at top-right -->
    <linearGradient id="ringGrad" x1="12%" y1="88%" x2="88%" y2="12%">
      <stop offset="0%" stop-color="#00f2cb" />
      <stop offset="25%" stop-color="#0be5af" />
      <stop offset="55%" stop-color="#26e38f" />
      <stop offset="85%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#5eed8e" />
    </linearGradient>

    <!-- AI text gradient: Cyan to vivid emerald -->
    <linearGradient id="aiTextGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c897" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Drop shadow for squircle tile -->
    <filter id="tileShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#01140d" flood-opacity="0.22" />
    </filter>

    <!-- Clip path to keep elements inside the squircle rounded boundary -->
    <clipPath id="squircleClip">
      <rect x="294" y="105" width="436" height="436" rx="98" ry="98" />
    </clipPath>

    <!-- Clip path for the front half of the ring (covers left leg up to middle) -->
    <clipPath id="leftRingClip">
      <rect x="250" y="50" width="235" height="500" />
    </clipPath>

    <!-- Master definition of the continuous 3D Orbit Ring -->
    <path id="fullOrbitRing"
          d="M 318 408
             C 338 426, 420 426, 510 386
             C 580 350, 638 300, 678 222
             C 658 260, 606 312, 536 352
             C 466 388, 396 394, 362 376
             C 342 366, 320 382, 318 408 Z"
          fill="url(#ringGrad)" />
  </defs>

  <!-- 1. Pure White Canvas Background -->
  <rect width="1024" height="1024" fill="#FFFFFF" />

  <!-- 2. The Emerald Squircle Tile -->
  <g filter="url(#tileShadow)">
    <rect x="294" y="105" width="436" height="436" rx="98" ry="98" fill="url(#sqBaseGrad)" />
    <rect x="294" y="105" width="436" height="436" rx="98" ry="98" fill="url(#topRightGlow)" />
  </g>

  <!-- 3. Emblem: 3D Interlocking Letter "A" & Ring -->
  <g clip-path="url(#squircleClip)">
    <!-- LAYER 1: Full Ring (Placed behind the Letter "A" so right leg is ON TOP) -->
    <use href="#fullOrbitRing" />

    <!-- LAYER 2: The Letter "A" (Solid Pure White, Rounded Apex, Open Arch, Flat Feet) -->
    <path d="
      M 482 208
      C 491 187 500 178 512 178
      C 524 178 533 187 542 208
      L 662 445
      L 590 445
      L 530 262
      C 524 246 518 240 512 240
      C 506 240 500 246 494 262
      L 434 445
      L 362 445
      Z
    " fill="#FFFFFF" />

    <!-- LAYER 3: Front Ring Segment (Drawn ON TOP of the Left Leg) -->
    <g clip-path="url(#leftRingClip)">
      <use href="#fullOrbitRing" />
    </g>

    <!-- LAYER 4: The 4-Pointed Star at Top-Right (Touching the Swoosh Trajectory) -->
    <g transform="translate(636, 186)">
      <path d="M 0 -36 
               C 2 -10 10 -2 36 0 
               C 10 2 2 10 0 36 
               C -2 10 -10 2 -36 0 
               C -10 -2 -2 -10 0 -36 Z" 
            fill="#4ade80" />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    </g>
  </g>

  <!-- 4. Typography: "Easy AI" -->
  <g text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="512" y="682" font-weight="900" font-size="134" letter-spacing="-3">
      <tspan fill="#07281f">Easy </tspan>
      <tspan fill="url(#aiTextGrad)">AI</tspan>
    </text>

    <!-- Typography: "Academia" -->
    <text x="512" y="822" font-weight="900" font-size="124" letter-spacing="-2" fill="#07281f">
      Academia
    </text>

    <!-- Tagline: "Learn  •  Build  •  Grow" -->
    <text x="512" y="906" font-weight="700" font-size="42" letter-spacing="8" fill="#07281f">
      <tspan>Learn</tspan>
      <tspan fill="#10b981" font-size="38">  •  </tspan>
      <tspan>Build</tspan>
      <tspan fill="#10b981" font-size="38">  •  </tspan>
      <tspan>Grow</tspan>
    </text>
  </g>
</svg>
